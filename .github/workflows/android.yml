name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK 37
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        # 缓存只读：避免 GitHub Actions 缓存服务间歇性故障导致构建被标记为失败
        # post-action 阶段缓存写入失败不会影响 job 退出码
        cache-read-only: true

    - name: Sync version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
        sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
        echo "Release version: $VERSION (versionCode=${{ github.run_number }})"

    - name: Build with Gradle
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # 注入更新检查用的长效 PAT（repo 级只读），供 BuildConfig.GITHUB_TOKEN 使用
        # 注意：禁止使用默认 secrets.GITHUB_TOKEN（短时效，打包后即失效），
        # 必须在仓库 Settings → Secrets 中配置名为 GH_PAT 的只读 PAT
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        # 可选：CNB 兜底数据源令牌（cnb.cool），供 BuildConfig.CNB_TOKEN 使用。
        # 未配置时为空，CNB 公开仓库仍可匿名访问。
        CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
