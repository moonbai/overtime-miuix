name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK 37
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        echo "sdkmanager version: $("$SDKMANAGER" --version)"
        # runner 预装的本地仓库索引(repository2-3.xml)是镜像构建时的旧快照，
        # sdkmanager 发现它存在就直接复用，从而看不到新发布的 Android 17 (API 37)。
        # 删除本地索引缓存，强制重新从 Google 拉取含 API 37 的最新索引后再安装。
        rm -f "$ANDROID_HOME"/repository2-3.xml "$ANDROID_HOME"/addons_list-3.xml
        rm -rf "$HOME/.android/cache"
        if "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"; then
          echo "Android SDK 37 installed"
        else
          echo "::error::安装 platforms;android-37 失败，列出可用 platforms 以便定位"
          "$SDKMANAGER" --list 2>/dev/null | grep -i "platforms;android" || true
          exit 1
        fi

    # 不使用 gradle/actions/setup-gradle：项目自带 Gradle Wrapper (9.8.2)
    # setup-gradle 依赖 GitHub Actions Cache Service 缓存/下载 Gradle 分发版，
    # 该服务近期频繁 400/503 导致构建失败（"Our services aren't available"）
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # 仓库默认分发地址指向腾讯镜像（供 CNB 国内流水线加速）。
    # GitHub-hosted runner 位于海外，跨境拉取该镜像常在读超时前无法完成，
    # 导致 wrapper 抛 SocketTimeoutException、构建尚未进入 Gradle 即失败。
    # 此处仅在本工作流内切到官方 CDN，CNB 侧配置不受影响。
    - name: Use official Gradle distribution on GitHub runners
      run: |
        sed -i 's#mirrors.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
        grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

    # 预热 wrapper 缓存：CDN 偶发抖动时重试，避免整个构建因单次下载失败中断
    - name: Warm Gradle wrapper (retry on CDN timeout)
      run: |
        for attempt in 1 2 3; do
          if ./gradlew --version; then exit 0; fi
          echo "::warning::Gradle download failed (attempt ${attempt}/3), retrying"
          rm -f "${GRADLE_USER_HOME:-$HOME/.gradle}"/wrapper/dists/gradle-9.8.2-bin/*/*.part
        done
        exit 1

    - name: Sync version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
        sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
        echo "Release version: $VERSION (versionCode=${{ github.run_number }})"

    - name: Build with Gradle
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # 注入更新检查用的长效 PAT（repo 级只读），供 BuildConfig.GITHUB_TOKEN 使用
        # 注意：禁止使用默认 secrets.GITHUB_TOKEN（短时效，打包后即失效），
        # 建议在仓库 Settings → Secrets 中配置名为 GH_PAT 的只读 PAT（5000 次/小时）。
        # 未配置也不影响打包：App 会走匿名 API（60 次/小时/IP），限流时自动降级到
        # GitHub 官方 releases.atom 订阅源（不受 REST API 配额限制），不再请求第三方镜像。
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        # 更新检查只使用 GitHub 官方数据源，无需再注入 CNB_TOKEN
      run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

    # 构建产物门禁：签名、包元信息、体积、校验和统一校验并写入构建摘要。
    # 任何一项失败立即中断，避免把未签名/压缩异常的包传到 Release。
    - name: Verify release artifact
      run: |
        set -e
        AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
        APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "==> 产物：$APK ($(du -h "$APK" | cut -f1))"
        echo "==> 签名校验："
        "$APKSIGNER" verify --print-certs "$APK" | head -8
        echo "==> 包元信息："
        "$AAPT" dump badging "$APK" | head -3
        VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
        SHA=$(sha256sum "$APK" | cut -d' ' -f1)
        {
          echo "### Release 构建产物"
          echo ""
          echo "| 项 | 值 |"
          echo "| --- | --- |"
          echo "| 文件 | \`$(basename "$APK")\` |"
          echo "| versionName | $VERSION |"
          echo "| 体积 | $(du -h "$APK" | cut -f1) |"
          echo "| SHA256 | \`$SHA\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Overtime-app-release
        path: app/build/outputs/apk/release/*.apk
        # 产物缺失必须失败，不能静默产出空 artifact 让下游误判构建成功
        if-no-files-found: error

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
