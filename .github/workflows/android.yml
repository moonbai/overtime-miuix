name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK 37
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        echo "sdkmanager version: $("$SDKMANAGER" --version)"
        # Android 17 的 SDK platform 包名是 platforms;android-37.0（带小数点，
        # 与 compileSdk 使用的整数 37 不同；同系列还有 37.1 / 37.2 稳定版）。
        # runner 预装的本地仓库索引(repository2-3.xml)是镜像构建时的旧快照，
        # sdkmanager 会直接复用从而看不到 android-37.0，因此删除本地索引缓存，
        # 强制重新从 Google 拉取最新索引后再安装。
        rm -f "$ANDROID_HOME"/repository2-3.xml "$ANDROID_HOME"/addons_list-3.xml
        rm -rf "$HOME/.android/cache"
        if "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"; then
          echo "Android SDK 37 installed"
        else
          echo "::error::安装 platforms;android-37.0 失败，列出可用 platforms 以便定位"
          "$SDKMANAGER" --list 2>/dev/null | grep -i "platforms;android" || true
          exit 1
        fi

    # 不使用 gradle/actions/setup-gradle：项目自带 Gradle Wrapper (9.8.2)
    # setup-gradle 依赖 GitHub Actions Cache Service 缓存/下载 Gradle 分发版，
    # 该服务近期频繁 400/503 导致构建失败（"Our services aren't available"）
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # 持久化 Gradle 依赖缓存：kotlin-compiler-embeddable 约 60MB，命中缓存后
    # 整条依赖链都不需要再走远端下载。缓存服务 400/503 时跳过即可，不阻断构建。
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/metadata-*
        key: gradle-deps-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle.kts', '**/*.gradle.kts') }}
        restore-keys: |
          gradle-deps-${{ runner.os }}-

    # kotlin-compiler-embeddable（约 60MB）从 repo.maven.apache.org 拉取时偶发被
    # 导向 GitHub Release 资产的未鉴权下载，返回 504 使 compileReleaseKotlin 失败
    # （堆栈顶层的 ClasspathEntrySnapshotTransform 只是表象）。
    # 仅在本工作流内把 Maven Central 直连镜像插到 mavenCentral() 之前：该端点
    # 直连返回 200 且不跳转；原 mavenCentral() 保留作兜底，本地与 CNB 不受影响。
    - name: Prefer direct Maven Central mirror on GitHub runners
      run: |
        sed -i 's#^\([[:space:]]*\)mavenCentral()#\1maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }\n\1mavenCentral()#' settings.gradle.kts
        grep -n 'storage-download.googleapis.com' settings.gradle.kts

    # 仓库默认分发地址指向腾讯云镜像（供 CNB 国内流水线加速）。
    # 实测 GitHub-hosted runner 上该镜像稳定可用，而 services.gradle.org 官方 CDN
    # 连续 3 次 10s 读超时（见 run #134 日志），因此保持仓库默认值不动，
    # 把官方 CDN 作为「镜像失败时」的兜底，避免每次构建先白等 30 秒。
    - name: Warm Gradle wrapper (retry on CDN timeout)
      run: |
        for attempt in 1 2 3; do
          if ./gradlew --version; then exit 0; fi
          echo "::warning::Gradle download failed (attempt ${attempt}/3), retrying"
          rm -f "${GRADLE_USER_HOME:-$HOME/.gradle}"/wrapper/dists/gradle-9.8.2-bin/*/*.part
        done
        echo "::warning::腾讯云镜像三次均失败，回退官方 Gradle CDN"
        sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
        ./gradlew --version

    - name: Sync version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
        sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
        echo "Release version: $VERSION (versionCode=${{ github.run_number }})"

    - name: Build with Gradle
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # 注入更新检查用的长效 PAT（repo 级只读），供 BuildConfig.GITHUB_TOKEN 使用
        # 注意：禁止使用默认 secrets.GITHUB_TOKEN（短时效，打包后即失效），
        # 建议在仓库 Settings → Secrets 中配置名为 GH_PAT 的只读 PAT（5000 次/小时）。
        # 未配置也不影响打包：App 会走匿名 API（60 次/小时/IP），限流时自动降级到
        # GitHub 官方 releases.atom 订阅源（不受 REST API 配额限制），不再请求第三方镜像。
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        # 更新检查只使用 GitHub 官方数据源，无需再注入 CNB_TOKEN
      # 不再使用 --refresh-dependencies：它会让每次构建强制重解析全部依赖，
      # 在冷缓存 runner 上等于每次重下 60MB 编译器 jar，把网络抖动放大成必现失败。
      # 保留重试：Gradle 增量构建让重试很便宜，足以吸收偶发的 5xx / 读超时。
      run: |
        for attempt in 1 2 3; do
          echo "::group::Gradle build (attempt ${attempt}/3)"
          if ./gradlew assembleRelease --no-daemon --stacktrace; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if [ "$attempt" -lt 3 ]; then
            echo "::warning::构建失败（第 ${attempt}/3 次），疑似网络抖动，10 秒后重试"
            sleep 10
          fi
        done
        echo "::error::连续 3 次构建失败"
        exit 1

    # 构建产物门禁：签名、包元信息、体积、校验和统一校验并写入构建摘要。
    # 任何一项失败立即中断，避免把未签名/压缩异常的包传到 Release。
    - name: Verify release artifact
      run: |
        set -e
        AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
        APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "==> 产物：$APK ($(du -h "$APK" | cut -f1))"
        echo "==> 签名校验："
        "$APKSIGNER" verify --print-certs "$APK" | head -8
        echo "==> 包元信息："
        "$AAPT" dump badging "$APK" | head -3
        VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
        SHA=$(sha256sum "$APK" | cut -d' ' -f1)
        {
          echo "### Release 构建产物"
          echo ""
          echo "| 项 | 值 |"
          echo "| --- | --- |"
          echo "| 文件 | \`$(basename "$APK")\` |"
          echo "| versionName | $VERSION |"
          echo "| 体积 | $(du -h "$APK" | cut -f1) |"
          echo "| SHA256 | \`$SHA\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Overtime-app-release
        path: app/build/outputs/apk/release/*.apk
        # 产物缺失必须失败，不能静默产出空 artifact 让下游误判构建成功
        if-no-files-found: error

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
