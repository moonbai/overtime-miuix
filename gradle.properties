org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
# android.enableJetifier=true  -- 已移除：AGP 9.x 已废弃，默认 false
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 默认 onlyEnableUnitTestForTheTestedBuildType=true，仅 tested build type 启用 unit test，
# 导致 release 的 enableUnitTest=false；而 Compose Preview 要求 unit test 开启，故关闭该限制。
android.onlyEnableUnitTestForTheTestedBuildType=false
systemProp.https.protocols=TLSv1.2,TLSv1.3

# 签名配置说明：
# - CI：通过 GitHub Secrets 注入环境变量 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# - 本地开发：将上述变量写入 local.properties（已 gitignore），切勿把密码放在本文件（会提交到 git）
